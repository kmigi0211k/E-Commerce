databases:
  - name: productos-pro-db
    databaseName: productospro
    user: admin_productos
    plan: free

services:
  - type: web
    name: productos-pro-web
    env: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: ProductosPro
      - key: APP_URL
        value: https://proyectointegrador-m084.onrender.com
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: "false"
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_COOKIE
        value: productospro_session
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: productos-pro-db
          property: connectionString
