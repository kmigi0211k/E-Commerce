version: '3.8'

services:
  # Aplicación Laravel (Apache + PHP 8.2/8.3)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productospro_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: productospro
      DB_PASSWORD: ${DB_PASSWORD:?Define una contraseña de aplicación en el archivo .env antes de iniciar Docker}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db
      - mailpit
    networks:
      - productospro_network

  # Base de Datos Relacional MySQL 8.0 (InnoDB, 3FN)
  db:
    image: mysql:8.0
    container_name: productospro_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define una contraseña root distinta en el archivo .env antes de iniciar Docker}
      MYSQL_DATABASE: laravel
      MYSQL_USER: productospro
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define una contraseña de aplicación en el archivo .env antes de iniciar Docker}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - productospro_network

  # Servidor de Correo para pruebas locales de Códigos OTP (MFA)
  mailpit:
    image: axllent/mailpit:latest
    container_name: productospro_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # Puerto SMTP
      - "127.0.0.1:8025:8025"  # Panel Web para visualizar correos recibidos
    networks:
      - productospro_network

networks:
  productospro_network:
    driver: bridge

volumes:
  db_data:
    driver: local
